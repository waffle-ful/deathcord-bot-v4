name: フォーカス要約（メンバー or キーワード）

on:
  workflow_dispatch:
    inputs:
      focus_type:
        description: '"member" or "keyword"'
        required: true
        type: string
      focus_target:
        description: 'メンバーID or キーワード'
        required: true
        type: string
      focus_name:
        description: '表示名'
        required: true
        type: string

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # キャッシュ無効化: discord.py削除後の requirements-batch.txt を確実に反映させる

      - name: Install dependencies
        run: pip install -r requirements-batch.txt

      - name: フォーカス要約を生成・投稿
        env:
          FOCUS_TYPE:          ${{ github.event.inputs.focus_type }}
          FOCUS_TARGET:        ${{ github.event.inputs.focus_target }}
          FOCUS_NAME:          ${{ github.event.inputs.focus_name }}
          DISCORD_BOT_TOKEN:   ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID:    ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
          EXCLUDE_CHANNEL_IDS: ${{ secrets.EXCLUDE_CHANNEL_IDS }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI:         ${{ secrets.MONGODB_URI }}
          SUMMARY_CHANNEL_ID:  ${{ secrets.SUMMARY_CHANNEL_ID }}
        run: python batch/focus_summary.py
