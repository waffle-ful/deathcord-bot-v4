name: Daily Market Report

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 平日JST 16:00
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-market.txt'

      - name: Install dependencies
        run: pip install -r requirements-market.txt

      - name: Run market report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN:   ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI:         ${{ secrets.MONGODB_URI }}
          SUMMARY_CHANNEL_ID:  ${{ secrets.SUMMARY_CHANNEL_ID }}
        run: python market_report.py
